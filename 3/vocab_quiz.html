<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>英文單字測驗</title>
  <style>
    :root{--main:#2b7cff;--accent:#ffcc00}
    body{font-family:Arial,Helvetica,sans-serif;line-height:1.4;margin:0;background:#f6f8fb;color:#111}
    header{background:linear-gradient(90deg,var(--main),#5aa0ff);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
    h1{margin:0;font-size:20px}
    .designer{font-size:14px;opacity:.9}
    main{padding:20px;max-width:880px;margin:18px auto;background:#fff;border-radius:8px;box-shadow:0 6px 22px rgba(2,20,60,.08)}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .timer{font-weight:700;color:var(--main)}
    .score{font-weight:700}
    .question-box{padding:14px;border-radius:6px;border:1px solid #eef2fb;background:#fbfdff}
    .choices{margin-top:10px;display:flex;flex-direction:column;gap:8px}
    label.choice{background:#fff;border-radius:6px;padding:10px;border:1px solid #e6eefc;display:flex;align-items:center;gap:10px;cursor:pointer}
    label.choice input{margin-right:8px}
    .controls{display:flex;gap:10px;align-items:center;margin-top:12px}
    button{background:var(--main);color:#fff;padding:8px 12px;border-radius:6px;border:0;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .bear{font-size:56px;text-align:center;margin:12px 0;min-height:72px}
    .bear .emo{display:inline-block;transition:transform .35s ease,opacity .35s}
    .cheer{transform:translateY(-6px) scale(1.08);}
    .cry{transform:translateY(6px) scale(.98);opacity:.9}
    .small{font-size:14px;color:#555;margin-top:6px;text-align:center}
    footer{padding:12px;text-align:center;color:#666;font-size:13px}
    .hidden{display:none}
  </style>
</head>
<body>
  <header>
    <h1>英文單字測驗 — 20 題</h1>
    <div class="designer">設計者：某某某</div>
  </header>
  <main>
    <div class="meta">
      <div class="timer">時間剩餘：<span id="time">10:00</span></div>
      <div class="score">得分：<span id="score">0</span> / 100</div>
    </div>

    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input id="sheetUrl" placeholder="在此貼上 Google Sheets 或 CSV 連結（可留空使用內建題庫）" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ddd">
      <button id="loadSheetBtn">載入題庫</button>
      <div style="font-size:13px;color:#666">或於網址加入 <code>?sheet=網址</code> 自動載入</div>
    </div>

    <div id="quiz-area">
      <div class="question-box">
        <div id="q-index">題目 1 / 20</div>
        <h2 id="question" style="margin:8px 0 0 0"></h2>
        <div class="choices" id="choices"></div>
        <div class="controls">
          <button id="submitBtn">提交答案</button>
          <button id="nextBtn" disabled>下一題</button>
          <div style="margin-left:auto;color:#777">每題 5 分</div>
        </div>
      </div>

      <div class="bear" id="bearArea">🐻</div>
      <div class="small" id="message">請從右方選出正確的英文單字或中文解釋後提交。</div>
    </div>

    <div id="result" class="hidden">
      <h2>測驗完成</h2>
      <p id="resultText"></p>
      <p class="small">請重新整理頁面以重做測驗。</p>
    </div>
  </main>
  <footer>題目來源：Google Sheets（如需載入請將試算表發布或公開）</footer>

  <script>
    // 主要設定
    // 若使用預設試算表，請確保已發布為 CSV 或公開存取；也可在上方貼入自訂網址或於網址列使用 ?sheet=...
    const DEFAULT_SHEET = 'https://docs.google.com/spreadsheets/d/1WNFJAjHWDrBns4N7H550pKPlSk4eh08C83OEabH4e5w';
    const TOTAL = 20;
    const TIME_LIMIT = 600; // seconds (10 minutes)
    const POINT_PER = 5;

    let questions = [];
    let current = 0;
    let score = 0;
    let timer = TIME_LIMIT;
    let timerId = null;

    const timeEl = document.getElementById('time');
    const scoreEl = document.getElementById('score');
    const qIndexEl = document.getElementById('q-index');
    const qEl = document.getElementById('question');
    const choicesEl = document.getElementById('choices');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const bearArea = document.getElementById('bearArea');
    const message = document.getElementById('message');
    const resultDiv = document.getElementById('result');
    const resultText = document.getElementById('resultText');

    submitBtn.addEventListener('click', onSubmit);
    nextBtn.addEventListener('click', nextQuestion);
    document.getElementById('loadSheetBtn').addEventListener('click', async ()=>{
      const url = document.getElementById('sheetUrl').value.trim();
      if(!url){ alert('請貼入 Google Sheets 或 CSV 連結，或留空使用內建題庫。'); return; }
      await attemptLoad(url);
    });

    // 若網址列帶有 ?sheet=，自動嘗試載入
    (function checkQuerySheet(){
      try{
        const params = new URLSearchParams(location.search);
        const s = params.get('sheet');
        if(s){ document.getElementById('sheetUrl').value = s; attemptLoad(s); }
      }catch(e){}
    })();

    function startTimer(){
      updateTime();
      timerId = setInterval(()=>{timer--; if(timer<=0){finish();} updateTime();},1000);
    }

    function updateTime(){
      const m = Math.floor(timer/60).toString().padStart(2,'0');
      const s = (timer%60).toString().padStart(2,'0');
      timeEl.textContent = `${m}:${s}`;
    }

    function showQuestion(){
      const q = questions[current];
      qIndexEl.textContent = `題目 ${current+1} / ${TOTAL}`;
      qEl.textContent = q.prompt;
      choicesEl.innerHTML = '';
      q.options.forEach((opt,i)=>{
        const id = `c-${i}`;
        const label = document.createElement('label');
        label.className = 'choice';
        label.innerHTML = `<input type="radio" name="choice" value="${i}" id="${id}"><span>${opt}</span>`;
        choicesEl.appendChild(label);
      });
      submitBtn.disabled = false;
      nextBtn.disabled = true;
      message.textContent = '請選擇答案後按「提交答案」。';
      bearArea.textContent = '🐻';
    }

    function onSubmit(){
      const sel = document.querySelector('input[name="choice"]:checked');
      if(!sel){ alert('請先選擇一個選項。'); return; }
      const answer = Number(sel.value);
      const q = questions[current];
      submitBtn.disabled = true;
      if(answer === q.answer){
        score += POINT_PER;
        scoreEl.textContent = score;
        showBear('cheer','答對！+5 分');
      } else {
        showBear('cry','答錯！正確答案：' + q.options[q.answer]);
      }
      nextBtn.disabled = false;
      // 如果為最後一題，下一題改成完成
      if(current === TOTAL-1){ nextBtn.textContent = '完成並顯示成績'; }
    }

    function showBear(mode,text){
      if(mode==='cheer'){
        bearArea.textContent = '🐻🎉';
        bearArea.classList.add('cheer');
        bearArea.classList.remove('cry');
      } else {
        bearArea.textContent = '🐻😢';
        bearArea.classList.add('cry');
        bearArea.classList.remove('cheer');
      }
      message.textContent = text;
    }

    function nextQuestion(){
      if(current === TOTAL-1){ finish(); return; }
      current++;
      showQuestion();
    }

    function finish(){
      clearInterval(timerId);
      document.getElementById('quiz-area').classList.add('hidden');
      resultDiv.classList.remove('hidden');
      resultText.innerHTML = `你得到 ${score} 分，答對 ${score/POINT_PER} 題（滿分 100 分）。`;
    }

    // CSV 解析（簡單版）
    function parseCSV(text){
      const rows = text.trim().split(/\r?\n/).map(r=>r.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/));
      return rows.map(r=>r.map(c=>c.replace(/^\"|\"$/g,'').trim()));
    }

    // 嘗試從 Google Sheets 載入題庫，失敗時使用內建題目
    // 嘗試載入題庫（可傳入自訂 url），若為 Google Sheets edit 連結會嘗試轉換為 CSV export 格式
    async function loadQuestions(url){
      try{
        const finalUrl = convertGoogleSheetToCSV(url) || url || (convertGoogleSheetToCSV(DEFAULT_SHEET));
        const res = await fetch(finalUrl);
        if(!res.ok) throw new Error('fetch fail');
        const txt = await res.text();
        const rows = parseCSV(txt);
        // 假設第一列為標頭，欄位：prompt,opt1,opt2,opt3,opt4,answerIndex（0-based）
        const data = rows.slice(1).map(r=>({prompt:r[0]||'',options:[r[1]||'',r[2]||'',r[3]||'',r[4]||''],answer: isNaN(Number(r[5]))?0:Number(r[5])})).filter(x=>x.prompt);
        if(data.length < TOTAL) throw new Error('not enough');
        questions = shuffle(data).slice(0,TOTAL);
      }catch(e){
        // fallback 內建題庫（示範，20 題）
        const fallback = [
          ['apple','蘋果','香蕉','橘子','葡萄',0],
          ['book','書','筆','桌子','椅子',0],
          ['cat','狗','貓','魚','鳥',1],
          ['blue','紅色','藍色','綠色','黃色',1],
          ['run','跑','跳','坐','站',0],
          ['happy','傷心','快樂','生氣','驚訝',1],
          ['water','水','火','風','土',0],
          ['school','學校','醫院','銀行','郵局',0],
          ['teacher','學生','老師','司機','廚師',1],
          ['music','音樂','數學','自然','社會',0],
          ['green','綠色','黑色','白色','粉紅',0],
          ['sleep','睡覺','吃飯','唱歌','跳舞',0],
          ['cold','冷的','熱的','溫暖','潮濕',0],
          ['drink','喝','看','寫','聽',0],
          ['friend','朋友','敵人','老師','家人',0],
          ['fast','快的','慢的','高的','矮的',0],
          ['car','汽車','腳踏車','飛機','船',0],
          ['door','門','窗','桌','椅',0],
          ['smile','微笑','哭泣','生氣','驚訝',0],
          ['apple pie','蘋果派','牛肉麵','壽司','炸雞',0]
        ];
        questions = fallback.map(r=>({prompt:r[0],options:[r[1],r[2],r[3],r[4]],answer:r[5]}));
      }
    }

    // 把 Google Sheets 的分享頁面或 edit 連結轉為 CSV export 連結（若無法解析回傳 null）
    function convertGoogleSheetToCSV(url){
      if(!url) return null;
      try{
        const u = new URL(url);
        // 支援 formats: /d/{id}/edit or /spreadsheets/d/{id}
        const m = u.pathname.match(/\/d\/([-_a-zA-Z0-9]+)(?:\/|$)/);
        const id = m ? m[1] : null;
        // 嘗試取得 gid（查詢或 hash）
        let gid = u.searchParams.get('gid');
        if(!gid && u.hash){ const h = u.hash; const mm = h.match(/gid=(\d+)/); if(mm) gid=mm[1]; }
        if(!id) return null;
        return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid||0}`;
      }catch(e){ return null; }
    }

    // 嘗試載入並初始化題庫（供按鈕與 query auto-use）
    async function attemptLoad(url){
      // 停掉舊計時，避免重複
      clearInterval(timerId);
      questions = [];
      try{
        await loadQuestions(url);
      }catch(e){
        alert('載入失敗，將使用內建題庫。\n若要從 Google Sheets 載入，請確認試算表已發布為 CSV 或共用為公開。');
        // 仍會在 loadQuestions 的 catch 使用 fallback
        await loadQuestions();
      }
      current = 0; score = 0; scoreEl.textContent = score;
      document.getElementById('quiz-area').classList.remove('hidden');
      resultDiv.classList.add('hidden');
      showQuestion(); startTimer();
    }

    // 小工具
    function shuffle(a){
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;
    }

    // 初始化
    (async ()=>{
      await loadQuestions();
      if(questions.length < TOTAL){ alert('題目數不足，請確認試算表內容或使用內建題庫。'); }
      // 若題目超過 TOTAL，已在 loadQuestions 中切片
      current = 0; score = 0; scoreEl.textContent = score;
      showQuestion(); startTimer();
    })();
  </script>
</body>
</html>
