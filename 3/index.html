<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>紅色火柴人打架遊戲</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f2937, #111827);
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      color: white;
    }

    .game-wrap {
      width: min(92vw, 960px);
      background: rgba(17, 24, 39, 0.9);
      border: 4px solid #fca5a5;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      padding: 22px;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      color: #fca5a5;
      font-size: clamp(1.7rem, 2.3vw, 2.6rem);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 1rem;
    }

    .health-bar {
      flex: 1;
      height: 14px;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #facc15, #ef4444);
      transition: width 0.2s ease;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(#7dd3fc 0%, #dbeafe 45%, #a7f3d0 46%, #4ade80 100%);
      border-radius: 16px;
      border: 3px solid rgba(255,255,255,0.2);
    }

    .controls {
      margin-top: 12px;
      text-align: center;
      color: #e5e7eb;
      line-height: 1.8;
      font-size: 0.96rem;
    }

    .controls strong {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <h1>紅色火柴人打架</h1>

    <div class="hud">
      <div>HP：<span id="playerHP">100</span></div>
      <div class="health-bar"><div class="health-fill" id="playerHealthFill"></div></div>
      <div>敵人：<span id="enemyHP">100</span></div>
    </div>

    <canvas id="gameCanvas" width="900" height="420"></canvas>

    <div class="controls">
      <div><strong>移動</strong>：左/右鍵</div>
      <div><strong>跳躍</strong>：上鍵</div>
      <div><strong>蹲下</strong>：下鍵</div>
      <div><strong>攻擊</strong>：空白鍵</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const playerHPDisplay = document.getElementById('playerHP');
    const enemyHPDisplay = document.getElementById('enemyHP');
    const playerHealthFill = document.getElementById('playerHealthFill');

    const groundY = 320;
    const keys = {};

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function createPlayer() {
      return {
        x: 160,
        y: groundY,
        width: 32,
        height: 110,
        vx: 0,
        vy: 0,
        speed: 5.5,
        jumpPower: 16,
        gravity: 0.7,
        onGround: true,
        crouching: false,
        facing: 1,
        hp: 100,
        attackTimer: 0,
        hitFlash: 0,
        attackCooldown: 0,
      };
    }

    function createEnemy() {
      return {
        x: 700,
        y: groundY,
        width: 32,
        height: 110,
        vx: 0,
        vy: 0,
        speed: 3,
        gravity: 0.7,
        onGround: true,
        crouching: false,
        facing: -1,
        hp: 100,
        attackTimer: 0,
        hitFlash: 0,
        attackCooldown: 0,
      };
    }

    let player = createPlayer();
    let enemy = createEnemy();
    let gameOver = false;

    function resetGame() {
      player = createPlayer();
      enemy = createEnemy();
      gameOver = false;
      updateHud();
    }

    function updateHud() {
      playerHPDisplay.textContent = Math.max(0, Math.ceil(player.hp));
      enemyHPDisplay.textContent = Math.max(0, Math.ceil(enemy.hp));
      playerHealthFill.style.width = (player.hp / 100) * 100 + '%';
    }

    function handleInput() {
      if (gameOver) return;

      if (keys['ArrowLeft'] || keys['a']) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (keys['ArrowRight'] || keys['d']) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx = 0;
      }

      if (keys['ArrowUp'] || keys['w']) {
        if (player.onGround) {
          player.vy = -player.jumpPower;
          player.onGround = false;
        }
      }

      player.crouching = !!(keys['ArrowDown'] || keys['s']);

      if (keys[' '] && player.attackCooldown <= 0) {
        player.attackTimer = 18;
        player.attackCooldown = 350;
        checkAttack(player, enemy);
      }
    }

    function updatePlayer() {
      const prevY = player.y;
      player.x += player.vx;
      player.x = clamp(player.x, 30, canvas.width - 110);

      if (!player.onGround) {
        player.vy += player.gravity;
      }

      player.y += player.vy;

      if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.onGround = true;
      }

      if (player.crouching && player.onGround) {
        player.height = 72;
      } else {
        player.height = 110;
      }

      if (player.attackCooldown > 0) {
        player.attackCooldown -= 16;
      }

      if (player.attackTimer > 0) {
        player.attackTimer -= 1;
      }

      if (player.hitFlash > 0) {
        player.hitFlash -= 1;
      }

      if (player.y !== prevY && !player.onGround) {
        player.crouching = false;
      }
    }

    function updateEnemy() {
      const dx = player.x - enemy.x;
      const absDx = Math.abs(dx);

      enemy.vx = 0;
      if (absDx > 20) {
        enemy.vx = (dx > 0 ? 1 : -1) * enemy.speed;
        enemy.facing = dx > 0 ? 1 : -1;
      }

      enemy.x += enemy.vx;
      enemy.x = clamp(enemy.x, 400, canvas.width - 80);

      if (!enemy.onGround) {
        enemy.vy += enemy.gravity;
      }

      enemy.y += enemy.vy;
      if (enemy.y >= groundY) {
        enemy.y = groundY;
        enemy.vy = 0;
        enemy.onGround = true;
      }

      if (player.x < enemy.x) {
        enemy.facing = -1;
      } else {
        enemy.facing = 1;
      }

      if (enemy.crouching && enemy.onGround) {
        enemy.height = 72;
      } else {
        enemy.height = 110;
      }

      if (enemy.attackCooldown > 0) {
        enemy.attackCooldown -= 16;
      }

      if (enemy.attackTimer > 0) {
        enemy.attackTimer -= 1;
      }

      if (enemy.hitFlash > 0) {
        enemy.hitFlash -= 1;
      }

      if (Math.abs(player.x - enemy.x) < 90 && Math.random() < 0.025 && enemy.attackCooldown <= 0) {
        enemy.attackTimer = 18;
        enemy.attackCooldown = 500;
        checkAttack(enemy, player);
      }
    }

    function checkAttack(attacker, target) {
      const reach = 75;
      const facingDir = attacker.facing;
      const dx = target.x - attacker.x;
      const inRange = Math.abs(dx) < reach && Math.abs(attacker.y - target.y) < 90;
      const facingCorrect = (facingDir === 1 && dx > 0) || (facingDir === -1 && dx < 0);

      if (inRange && facingCorrect) {
        const damage = target.crouching ? 8 : 14;
        target.hp -= damage;
        target.hitFlash = 10;
        target.x += attacker.facing * 18;
        if (target.hp <= 0) {
          target.hp = 0;
          gameOver = true;
          setTimeout(() => resetGame(), 1200);
        }
      }
      updateHud();
    }

    function drawGround() {
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(0, groundY + 20, canvas.width, canvas.height - groundY - 20);

      ctx.fillStyle = '#d1fae5';
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.fillRect(i, groundY + 22, 15, 8);
      }
    }

    function drawStickFigure(unit, color, isEnemy = false) {
      const x = unit.x;
      const y = unit.y;
      const bodyHeight = unit.height;
      const headRadius = 18;
      const torsoHeight = unit.crouching ? 26 : 52;
      const bodyY = y - bodyHeight + 18;

      ctx.save();
      ctx.translate(x, y);

      ctx.strokeStyle = color;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.arc(0, -bodyHeight + headRadius + 8, headRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -bodyHeight + 28);
      ctx.lineTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.moveTo(0, -bodyHeight + 38);
      ctx.lineTo(18 * unit.facing, -bodyHeight + 60);
      ctx.moveTo(0, -bodyHeight + 38);
      ctx.lineTo(-18 * unit.facing, -bodyHeight + 60);
      ctx.moveTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.lineTo(24 * unit.facing, -bodyHeight + 28 + torsoHeight + 40);
      ctx.moveTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.lineTo(-24 * unit.facing, -bodyHeight + 28 + torsoHeight + 40);
      ctx.stroke();

      if (unit.attackTimer > 0) {
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(20 * unit.facing, -bodyHeight + 50, 22, -1.2, 1.2);
        ctx.stroke();
      }

      if (unit.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(-28, -bodyHeight - 18, 56, bodyHeight + 26);
      }

      ctx.restore();
    }

    function drawUI() {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
      ctx.fillRect(18, 18, 200, 52);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 24px Microsoft JhengHei';
      ctx.fillText('紅色火柴人', 28, 52);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 52px Microsoft JhengHei';
        ctx.textAlign = 'center';
        ctx.fillText('勝負已分！', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '24px Microsoft JhengHei';
        ctx.fillText('重新開始中...', canvas.width / 2, canvas.height / 2 + 40);
        ctx.textAlign = 'left';
      }
    }

    function drawBackground() {
      ctx.fillStyle = '#7dd3fc';
      ctx.fillRect(0, 0, canvas.width, groundY);

      ctx.fillStyle = '#93c5fd';
      for (let i = 0; i < 7; i++) {
        const x = i * 170 + 80;
        const y = 86 + (i % 2) * 18;
        ctx.beginPath();
        ctx.moveTo(x, y + 80);
        ctx.lineTo(x + 40, y);
        ctx.lineTo(x + 80, y + 80);
        ctx.fill();
      }

      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, groundY, canvas.width, 40);
    }

    function gameLoop() {
      handleInput();
      updatePlayer();
      updateEnemy();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawGround();

      drawStickFigure(enemy, '#60a5fa', true);
      drawStickFigure(player, '#ef4444', false);
      drawUI();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', function (e) {
      const key = e.key;
      keys[key] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', function (e) {
      keys[e.key] = false;
    });

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
