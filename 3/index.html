<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>精緻紅色火柴人打架</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, rgba(251, 113, 133, 0.18), transparent 35%),
        linear-gradient(135deg, #0f172a, #111827 40%, #1f2937);
      font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
      color: #f8fafc;
    }

    .game-wrap {
      width: min(94vw, 980px);
      padding: 20px 20px 16px;
      border-radius: 26px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(248, 113, 113, 0.9);
      box-shadow:
        0 0 0 3px rgba(239, 68, 68, 0.15),
        0 25px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 6px 8px 10px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.7rem);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fca5a5;
      text-shadow: 0 0 12px rgba(251, 113, 133, 0.4);
    }

    .badge {
      padding: 7px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #f97316);
      border-radius: 999px;
      box-shadow: 0 8px 16px rgba(239, 68, 68, 0.35);
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr 1.7fr 1fr;
      gap: 18px;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .label {
      font-size: 0.92rem;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 1px;
    }

    .health-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .health-bar {
      position: relative;
      flex: 1;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.18);
    }

    .health-fill {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e 0%, #a3e635 30%, #facc15 60%, #ef4444 100%);
      transition: width 0.18s ease;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.3);
    }

    .value {
      min-width: 44px;
      text-align: center;
      font-weight: 800;
      color: #f8fafc;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.12);
      background: linear-gradient(#7dd3fc 0%, #dbeafe 46%, #dcfce7 47%, #4ade80 100%);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.12);
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 14px;
      padding: 12px 10px 2px;
      font-size: 0.96rem;
      color: #dbeafe;
    }

    .control-item {
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .control-item strong {
      color: #fca5a5;
    }

    @media (max-width: 640px) {
      .game-wrap {
        padding: 14px 12px 12px;
      }

      .hud {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .title-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="title-bar">
      <h1 class="title">紅色火柴人打架</h1>
      <div class="badge">Arena Fight</div>
    </div>

    <div class="hud">
      <div class="health-wrap">
        <span class="label">紅色</span>
        <div class="health-bar">
          <div class="health-fill" id="playerHealthFill"></div>
        </div>
        <span class="value" id="playerHP">100</span>
      </div>

      <div style="text-align:center; font-weight:800; color:#f8fafc; letter-spacing:2px;">VS</div>

      <div class="health-wrap">
        <span class="label">藍色</span>
        <div class="health-bar">
          <div class="health-fill" id="enemyHealthFill" style="background: linear-gradient(90deg, #38bdf8 0%, #60a5fa 35%, #a78bfa 100%);"></div>
        </div>
        <span class="value" id="enemyHP">100</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="900" height="420"></canvas>

    <div class="controls">
      <div class="control-item"><strong>移動</strong>：左右鍵</div>
      <div class="control-item"><strong>跳躍</strong>：上鍵</div>
      <div class="control-item"><strong>蹲下</strong>：下鍵</div>
      <div class="control-item"><strong>攻擊</strong>：空白鍵</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const playerHPDisplay = document.getElementById('playerHP');
    const enemyHPDisplay = document.getElementById('enemyHP');
    const playerHealthFill = document.getElementById('playerHealthFill');
    const enemyHealthFill = document.getElementById('enemyHealthFill');

    const groundY = 320;
    const keys = {};

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function createPlayer() {
      return {
        x: 170,
        y: groundY,
        width: 32,
        height: 112,
        vx: 0,
        vy: 0,
        speed: 5.7,
        jumpPower: 16.5,
        gravity: 0.7,
        onGround: true,
        crouching: false,
        facing: 1,
        hp: 100,
        hitFlash: 0,
        attackTimer: 0,
        attackCooldown: 0,
      };
    }

    function createEnemy() {
      return {
        x: 690,
        y: groundY,
        width: 32,
        height: 112,
        vx: 0,
        vy: 0,
        speed: 3.2,
        gravity: 0.7,
        onGround: true,
        crouching: false,
        facing: -1,
        hp: 100,
        hitFlash: 0,
        attackTimer: 0,
        attackCooldown: 0,
      };
    }

    let player = createPlayer();
    let enemy = createEnemy();
    let gameOver = false;
    let winnerText = '';

    function resetGame() {
      player = createPlayer();
      enemy = createEnemy();
      gameOver = false;
      winnerText = '';
      updateHud();
    }

    function updateHud() {
      playerHPDisplay.textContent = clamp(Math.ceil(player.hp), 0, 100);
      enemyHPDisplay.textContent = clamp(Math.ceil(enemy.hp), 0, 100);
      playerHealthFill.style.width = (player.hp / 100) * 100 + '%';
      enemyHealthFill.style.width = (enemy.hp / 100) * 100 + '%';
    }

    function handleInput() {
      if (gameOver) return;

      if (keys['ArrowLeft'] || keys['a']) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (keys['ArrowRight'] || keys['d']) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx = 0;
      }

      if ((keys['ArrowUp'] || keys['w']) && player.onGround) {
        player.vy = -player.jumpPower;
        player.onGround = false;
      }

      player.crouching = !!(keys['ArrowDown'] || keys['s']);

      if ((keys[' '] || keys['Space']) && player.attackCooldown <= 0) {
        player.attackCooldown = 430;
        player.attackTimer = 18;
        checkAttack(player, enemy);
      }
    }

    function updatePlayer() {
      player.x += player.vx;
      player.x = clamp(player.x, 35, canvas.width - 90);

      if (!player.onGround) {
        player.vy += player.gravity;
      }

      player.y += player.vy;

      if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.onGround = true;
      }

      if (player.crouching && player.onGround) {
        player.height = 72;
      } else {
        player.height = 112;
      }

      if (player.attackCooldown > 0) {
        player.attackCooldown -= 16;
      }

      if (player.attackTimer > 0) {
        player.attackTimer -= 1;
      }

      if (player.hitFlash > 0) {
        player.hitFlash -= 1;
      }
    }

    function updateEnemy() {
      const dx = player.x - enemy.x;
      const dist = Math.abs(dx);

      if (dist > 18) {
        enemy.vx = (dx > 0 ? 1 : -1) * enemy.speed;
        enemy.facing = dx > 0 ? 1 : -1;
      } else {
        enemy.vx = 0;
      }

      enemy.x += enemy.vx;
      enemy.x = clamp(enemy.x, 420, canvas.width - 90);

      if (!enemy.onGround) {
        enemy.vy += enemy.gravity;
      }

      enemy.y += enemy.vy;
      if (enemy.y >= groundY) {
        enemy.y = groundY;
        enemy.vy = 0;
        enemy.onGround = true;
      }

      if (enemy.crouching && enemy.onGround) {
        enemy.height = 72;
      } else {
        enemy.height = 112;
      }

      if (enemy.attackCooldown > 0) {
        enemy.attackCooldown -= 16;
      }

      if (enemy.attackTimer > 0) {
        enemy.attackTimer -= 1;
      }

      if (enemy.hitFlash > 0) {
        enemy.hitFlash -= 1;
      }

      if (Math.abs(player.x - enemy.x) < 110 && Math.random() < 0.028 && enemy.attackCooldown <= 0) {
        enemy.attackCooldown = 540;
        enemy.attackTimer = 20;
        checkAttack(enemy, player);
      }
    }

    function checkAttack(attacker, target) {
      const reach = 82;
      const dx = target.x - attacker.x;
      const inRange = Math.abs(dx) < reach && Math.abs(attacker.y - target.y) < 95;
      const facingCorrect = (attacker.facing === 1 && dx > 0) || (attacker.facing === -1 && dx < 0);

      if (inRange && facingCorrect) {
        const damage = target.crouching ? 9 : 15;
        target.hp -= damage;
        target.hitFlash = 12;
        target.x += attacker.facing * 14;

        if (target.hp <= 0) {
          target.hp = 0;
          gameOver = true;
          winnerText = attacker === player ? '你贏了！' : '敵人獲勝！';
          setTimeout(() => resetGame(), 1500);
        }
      }

      updateHud();
    }

    function drawBackground() {
      ctx.fillStyle = '#7dd3fc';
      ctx.fillRect(0, 0, canvas.width, groundY);

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      for (let i = 0; i < 8; i++) {
        const x = i * 160 + 60;
        const y = 140 + (i % 2) * 18;
        ctx.beginPath();
        ctx.moveTo(x, y + 60);
        ctx.lineTo(x + 36, y);
        ctx.lineTo(x + 72, y + 60);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = '#14532d';
      for (let i = 0; i < canvas.width; i += 28) {
        ctx.fillRect(i, groundY + 8, 12, 10);
      }
    }

    function drawArenaGlow() {
      const grd = ctx.createRadialGradient(canvas.width / 2, groundY - 10, 20, canvas.width / 2, groundY - 10, 300);
      grd.addColorStop(0, 'rgba(255,255,255,0.16)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, groundY + 50);
    }

    function drawStickFigure(unit, color) {
      const x = unit.x;
      const y = unit.y;
      const bodyHeight = unit.height;
      const headRadius = 18;
      const torsoHeight = unit.crouching ? 28 : 52;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.18)';
      ctx.beginPath();
      ctx.ellipse(0, 18, 26, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = color;
      ctx.lineWidth = 12;

      ctx.beginPath();
      ctx.arc(0, -bodyHeight + headRadius + 8, headRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -bodyHeight + 28);
      ctx.lineTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.moveTo(0, -bodyHeight + 38);
      ctx.lineTo(18 * unit.facing, -bodyHeight + 68);
      ctx.moveTo(0, -bodyHeight + 38);
      ctx.lineTo(-18 * unit.facing, -bodyHeight + 68);
      ctx.moveTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.lineTo(26 * unit.facing, -bodyHeight + 28 + torsoHeight + 38);
      ctx.moveTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.lineTo(-26 * unit.facing, -bodyHeight + 28 + torsoHeight + 38);
      ctx.stroke();

      const punchReach = unit.attackTimer > 0 ? 18 : 0;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 14;
      ctx.moveTo(0, -bodyHeight + 48);
      ctx.lineTo(punchReach * unit.facing, -bodyHeight + 48);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.beginPath();
      ctx.arc(-6, -bodyHeight + headRadius + 1, 5, 0, Math.PI * 2);
      ctx.fill();

      if (unit.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.fillRect(-26, -bodyHeight - 8, 52, bodyHeight + 18);
      }

      ctx.restore();
    }

    function drawFightText() {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (gameOver) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 52px Microsoft JhengHei';
        ctx.textAlign = 'center';
        ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '700 24px Microsoft JhengHei';
        ctx.fillText('重新開始中...', canvas.width / 2, canvas.height / 2 + 35);
        ctx.textAlign = 'left';
      }
    }

    function drawCenterLine() {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, groundY + 40);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function gameLoop() {
      handleInput();
      updatePlayer();
      updateEnemy();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      drawArenaGlow();
      drawCenterLine();
      drawStickFigure(enemy, '#60a5fa');
      drawStickFigure(player, '#ef4444');
      drawFightText();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', function (e) {
      const key = e.key;
      keys[key] = true;

      if ([ 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ' ].includes(key)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', function (e) {
      keys[e.key] = false;
    });

    updateHud();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
