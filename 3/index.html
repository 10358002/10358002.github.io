<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>精緻紅色火柴人打架</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, rgba(251, 113, 133, 0.18), transparent 35%),
        linear-gradient(135deg, #0f172a, #111827 40%, #1f2937);
      font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
      color: #f8fafc;
    }

    .game-wrap {
      width: min(94vw, 980px);
      padding: 20px 20px 16px;
      border-radius: 26px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(248, 113, 113, 0.9);
      box-shadow:
        0 0 0 3px rgba(239, 68, 68, 0.15),
        0 25px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 6px 8px 10px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.7rem);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fca5a5;
      text-shadow: 0 0 12px rgba(251, 113, 133, 0.4);
    }

    .badge {
      padding: 7px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #f97316);
      border-radius: 999px;
      box-shadow: 0 8px 16px rgba(239, 68, 68, 0.35);
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr 1.7fr 1fr;
      gap: 18px;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .label {
      font-size: 0.92rem;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 1px;
    }

    .health-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .health-bar {
      position: relative;
      flex: 1;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.18);
    }

    .health-fill {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e 0%, #a3e635 30%, #facc15 60%, #ef4444 100%);
      transition: width 0.18s ease;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.3);
    }

    .value {
      min-width: 44px;
      text-align: center;
      font-weight: 800;
      color: #f8fafc;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.12);
      background: linear-gradient(#7dd3fc 0%, #dbeafe 46%, #dcfce7 47%, #4ade80 100%);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.12);
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 14px;
      padding: 12px 10px 2px;
      font-size: 0.96rem;
      color: #dbeafe;
    }

    .control-item {
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .control-item strong {
      color: #fca5a5;
    }

    @media (max-width: 640px) {
      .game-wrap {
        padding: 14px 12px 12px;
      }

      .hud {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .title-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="title-bar">
      <h1 class="title">紅色火柴人打架</h1>
      <div class="badge">Arena Fight</div>
    </div>

    <div class="hud">
      <div class="health-wrap">
        <span class="label">紅色</span>
        <div class="health-bar">
          <div class="health-fill" id="playerHealthFill"></div>
        </div>
        <span class="value" id="playerHP">100</span>
      </div>

      <div style="text-align:center; font-weight:800; color:#f8fafc; letter-spacing:2px;">VS</div>

      <div class="health-wrap">
        <span class="label">藍色</span>
        <div class="health-bar">
          <div class="health-fill" id="enemyHealthFill" style="background: linear-gradient(90deg, #38bdf8 0%, #60a5fa 35%, #a78bfa 100%);"></div>
        </div>
        <span class="value" id="enemyHP">100</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="900" height="420"></canvas>

    <div class="controls">
      <div class="control-item"><strong>移動</strong>：左右鍵</div>
      <div class="control-item"><strong>跳躍</strong>：上鍵</div>
      <div class="control-item"><strong>蹲下</strong>：下鍵</div>
      <div class="control-item"><strong>近攻</strong>：A</div>
      <div class="control-item"><strong>遠攻</strong>：S</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const playerHPDisplay = document.getElementById('playerHP');
    const enemyHPDisplay = document.getElementById('enemyHP');
    const playerHealthFill = document.getElementById('playerHealthFill');
    const enemyHealthFill = document.getElementById('enemyHealthFill');

    const groundY = 320;
    const keys = {};
    const projectiles = [];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function createPlayer() {
      return {
        x: 170,
        y: groundY,
        width: 32,
        height: 112,
        vx: 0,
        vy: 0,
        speed: 6.2,
        jumpPower: 17.2,
        gravity: 0.72,
        onGround: true,
        crouching: false,
        facing: 1,
        hp: 100,
        hitFlash: 0,
        attackTimer: 0,
        attackCooldown: 0,
        attackType: null,
        walkCycle: 0,
        runBoost: 0,
      };
    }

    function createEnemy() {
      return {
        x: 690,
        y: groundY,
        width: 32,
        height: 112,
        vx: 0,
        vy: 0,
        speed: 4.2,
        jumpPower: 16.8,
        gravity: 0.72,
        onGround: true,
        crouching: false,
        facing: -1,
        hp: 100,
        hitFlash: 0,
        attackTimer: 0,
        attackCooldown: 0,
        attackType: null,
        walkCycle: 0,
        runBoost: 0,
      };
    }

    function createProjectile(owner, x, y, dx, damage) {
      return {
        owner,
        x,
        y,
        radius: 7,
        vx: dx,
        damage,
        ttl: 100,
      };
    }

    let player = createPlayer();
    let enemy = createEnemy();
    let gameOver = false;
    let winnerText = '';

    function resetGame() {
      player = createPlayer();
      enemy = createEnemy();
      projectiles.length = 0;
      gameOver = false;
      winnerText = '';
      updateHud();
    }

    function updateHud() {
      playerHPDisplay.textContent = clamp(Math.ceil(player.hp), 0, 100);
      enemyHPDisplay.textContent = clamp(Math.ceil(enemy.hp), 0, 100);
      playerHealthFill.style.width = (player.hp / 100) * 100 + '%';
      enemyHealthFill.style.width = (enemy.hp / 100) * 100 + '%';
    }

    function performAttack(attacker, target, type) {
      if (attacker.attackCooldown > 0 || gameOver) return;

      attacker.attackCooldown = type === 'near' ? 420 : 620;
      attacker.attackTimer = type === 'near' ? 16 : 22;
      attacker.attackType = type;

      if (type === 'near') {
        const dx = target.x - attacker.x;
        const dist = Math.abs(dx);
        const inRange = dist < 95 && Math.abs(attacker.y - target.y) < 100;
        const facingCorrect = (attacker.facing === 1 && dx > 0) || (attacker.facing === -1 && dx < 0);

        if (inRange && facingCorrect) {
          const damage = target.crouching ? 10 : 16;
          target.hp -= damage;
          target.hitFlash = 12;
          target.x += attacker.facing * 16;
          if (target.hp <= 0) {
            target.hp = 0;
            gameOver = true;
            winnerText = attacker === player ? '你贏了！' : '敵人獲勝！';
            setTimeout(() => resetGame(), 1500);
          }
        }
      } else {
        const spawnX = attacker.x + attacker.facing * 28;
        const spawnY = attacker.y - 62;
        const speed = attacker === player ? 9.5 : 8.8;
        projectiles.push(createProjectile(attacker, spawnX, spawnY, attacker.facing * speed, 14));
      }

      updateHud();
    }

    function normalizeKey(key) {
      if (key === ' ') return ' ';
      return key.length === 1 ? key.toLowerCase() : key;
    }

    function handleInput() {
      if (gameOver) return;

      if (keys['ArrowLeft'] || keys['arrowleft'] || keys['a']) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (keys['ArrowRight'] || keys['arrowright'] || keys['d']) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx = 0;
      }

      if ((keys['ArrowUp'] || keys['arrowup'] || keys['w']) && player.onGround) {
        player.vy = -player.jumpPower;
        player.onGround = false;
      }

      player.crouching = !!(keys['ArrowDown'] || keys['arrowdown'] || keys['s']);

      if ((keys['a'] || keys['A']) && player.attackCooldown <= 0) {
        performAttack(player, enemy, 'near');
      }

      if ((keys['s'] || keys['S']) && player.attackCooldown <= 0) {
        performAttack(player, enemy, 'far');
      }
    }

    function updatePlayer() {
      player.x += player.vx;
      player.x = clamp(player.x, 35, canvas.width - 90);

      if (!player.onGround) {
        player.vy += player.gravity;
      }

      player.y += player.vy;

      if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.onGround = true;
      }

      if (player.crouching && player.onGround) {
        player.height = 72;
      } else {
        player.height = 112;
      }

      if (player.attackCooldown > 0) {
        player.attackCooldown -= 16;
      }

      if (player.attackTimer > 0) {
        player.attackTimer -= 1;
      }

      if (player.hitFlash > 0) {
        player.hitFlash -= 1;
      }

      const isRunning = Math.abs(player.vx) > 0.5 && player.onGround;
      if (isRunning) {
        player.walkCycle += 0.42;
        player.runBoost = 1;
      } else {
        player.walkCycle *= 0.8;
        player.runBoost *= 0.8;
      }
    }

    function updateEnemy() {
      const dx = player.x - enemy.x;
      const dist = Math.abs(dx);

      if (dist > 20) {
        const runFactor = dist > 180 ? 1.3 : 1;
        enemy.vx = (dx > 0 ? 1 : -1) * enemy.speed * runFactor;
        enemy.facing = dx > 0 ? 1 : -1;
      } else {
        enemy.vx = 0;
      }

      enemy.x += enemy.vx;
      enemy.x = clamp(enemy.x, 420, canvas.width - 90);

      if (!enemy.onGround) {
        enemy.vy += enemy.gravity;
      }

      enemy.y += enemy.vy;
      if (enemy.y >= groundY) {
        enemy.y = groundY;
        enemy.vy = 0;
        enemy.onGround = true;
      }

      enemy.crouching = dist < 45 && Math.abs(player.y - enemy.y) < 40 && Math.random() < 0.03;

      if (enemy.crouching && enemy.onGround) {
        enemy.height = 72;
      } else {
        enemy.height = 112;
      }

      if (enemy.attackCooldown > 0) {
        enemy.attackCooldown -= 16;
      }

      if (enemy.attackTimer > 0) {
        enemy.attackTimer -= 1;
      }

      if (enemy.hitFlash > 0) {
        enemy.hitFlash -= 1;
      }

      const isRunning = Math.abs(enemy.vx) > 0.5 && enemy.onGround;
      if (isRunning) {
        enemy.walkCycle += 0.34;
        enemy.runBoost = 1;
      } else {
        enemy.walkCycle *= 0.8;
        enemy.runBoost *= 0.8;
      }

      if (enemy.onGround && dist < 100 && Math.random() < 0.02) {
        enemy.vy = -enemy.jumpPower * 0.85;
        enemy.onGround = false;
      }

      if (enemy.attackCooldown <= 0 && !gameOver) {
        if (dist < 96 && Math.random() < 0.08) {
          performAttack(enemy, player, 'near');
        } else if (dist < 240 && Math.random() < 0.06) {
          performAttack(enemy, player, 'far');
        }
      }
    }

    function updateProjectiles() {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const bullet = projectiles[i];
        bullet.x += bullet.vx;
        bullet.ttl -= 1;

        if (bullet.owner === player) {
          if (Math.abs(bullet.x - enemy.x) < 20 && Math.abs(bullet.y - (enemy.y - 50)) < 26) {
            enemy.hp -= bullet.damage;
            enemy.hitFlash = 14;
            projectiles.splice(i, 1);
            if (enemy.hp <= 0) {
              enemy.hp = 0;
              gameOver = true;
              winnerText = '你贏了！';
              setTimeout(() => resetGame(), 1500);
            }
            updateHud();
            continue;
          }
        } else {
          if (Math.abs(bullet.x - player.x) < 20 && Math.abs(bullet.y - (player.y - 50)) < 26) {
            player.hp -= bullet.damage;
            player.hitFlash = 14;
            projectiles.splice(i, 1);
            if (player.hp <= 0) {
              player.hp = 0;
              gameOver = true;
              winnerText = '敵人獲勝！';
              setTimeout(() => resetGame(), 1500);
            }
            updateHud();
            continue;
          }
        }

        if (bullet.ttl <= 0 || bullet.x < 0 || bullet.x > canvas.width) {
          projectiles.splice(i, 1);
        }
      }
    }

    function drawBackground() {
      ctx.fillStyle = '#7dd3fc';
      ctx.fillRect(0, 0, canvas.width, groundY);

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      for (let i = 0; i < 8; i++) {
        const x = i * 160 + 60;
        const y = 140 + (i % 2) * 18;
        ctx.beginPath();
        ctx.moveTo(x, y + 60);
        ctx.lineTo(x + 36, y);
        ctx.lineTo(x + 72, y + 60);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = '#14532d';
      for (let i = 0; i < canvas.width; i += 28) {
        ctx.fillRect(i, groundY + 8, 12, 10);
      }
    }

    function drawArenaGlow() {
      const grd = ctx.createRadialGradient(canvas.width / 2, groundY - 10, 20, canvas.width / 2, groundY - 10, 300);
      grd.addColorStop(0, 'rgba(255,255,255,0.16)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, groundY + 50);
    }

    function drawProjectiles() {
      for (const bullet of projectiles) {
        ctx.beginPath();
        ctx.fillStyle = bullet.owner === player ? '#fbbf24' : '#7dd3fc';
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawStickFigure(unit, color) {
      const x = unit.x;
      const y = unit.y;
      const bodyHeight = unit.height;
      const headRadius = 18;
      const torsoHeight = unit.crouching ? 28 : 52;
      const runAmplitude = unit.onGround && Math.abs(unit.vx) > 0.5 ? Math.sin(unit.walkCycle) * 8 : 0;
      const bodyLean = unit.onGround && Math.abs(unit.vx) > 0.5 ? Math.sin(unit.walkCycle) * 10 : 0;
      const bob = unit.onGround && Math.abs(unit.vx) > 0.5 ? Math.sin(unit.walkCycle * 1.8) * 4 : 0;

      ctx.save();
      ctx.translate(x, y + bob);
      ctx.rotate(bodyLean * Math.PI / 180);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.18)';
      ctx.beginPath();
      ctx.ellipse(0, 18, 26, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = color;
      ctx.lineWidth = 12;

      ctx.beginPath();
      ctx.arc(0, -bodyHeight + headRadius + 8, headRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.stroke();

      const armSwing = Math.sin(unit.walkCycle) * (unit.attackType === 'near' ? 15 : 12) + (unit.attackType === 'near' ? 10 : 0);
      const legSwing = Math.sin(unit.walkCycle) * 14;
      const armX = unit.facing * 18;
      const legX = unit.facing * 26;

      ctx.beginPath();
      ctx.moveTo(0, -bodyHeight + 28);
      ctx.lineTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.moveTo(0, -bodyHeight + 38);
      ctx.lineTo(armX + armSwing, -bodyHeight + 68);
      ctx.moveTo(0, -bodyHeight + 38);
      ctx.lineTo(-armX - armSwing, -bodyHeight + 68);
      ctx.moveTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.lineTo(legX + legSwing, -bodyHeight + 28 + torsoHeight + 38);
      ctx.moveTo(0, -bodyHeight + 28 + torsoHeight);
      ctx.lineTo(-legX - legSwing, -bodyHeight + 28 + torsoHeight + 38);
      ctx.stroke();

      const punchReach = unit.attackTimer > 0 && unit.attackType === 'near' ? 24 : 0;
      const punchY = -bodyHeight + 48;
      ctx.beginPath();
      ctx.strokeStyle = '#fef3c7';
      ctx.lineWidth = 14;
      ctx.moveTo(0, punchY);
      ctx.lineTo(punchReach * unit.facing, punchY - runAmplitude * 0.2);
      ctx.stroke();

      if (unit.attackType === 'far' && unit.attackTimer > 0) {
        ctx.beginPath();
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 9;
        ctx.moveTo(unit.facing * 10, -bodyHeight + 42);
        ctx.lineTo(unit.facing * 34, -bodyHeight + 42);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.beginPath();
      ctx.arc(-6, -bodyHeight + headRadius + 1, 5, 0, Math.PI * 2);
      ctx.fill();

      if (unit.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.fillRect(-26, -bodyHeight - 8, 52, bodyHeight + 18);
      }

      ctx.restore();
    }

    function drawFightText() {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (gameOver) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 52px Microsoft JhengHei';
        ctx.textAlign = 'center';
        ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '700 24px Microsoft JhengHei';
        ctx.fillText('重新開始中...', canvas.width / 2, canvas.height / 2 + 35);
        ctx.textAlign = 'left';
      }
    }

    function drawCenterLine() {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, groundY + 40);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function gameLoop() {
      handleInput();
      updatePlayer();
      updateEnemy();
      updateProjectiles();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      drawArenaGlow();
      drawCenterLine();
      drawProjectiles();
      drawStickFigure(enemy, '#60a5fa');
      drawStickFigure(player, '#ef4444');
      drawFightText();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', function (e) {
      const key = e.code === 'Space' ? ' ' : e.key;
      const lower = normalizeKey(key);
      keys[key] = true;
      keys[lower] = true;

      if ([ 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright' ].includes(lower) || [ 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ' ].includes(key)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', function (e) {
      const key = e.code === 'Space' ? ' ' : e.key;
      const lower = normalizeKey(key);
      keys[key] = false;
      keys[lower] = false;
    });

    updateHud();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
