<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網站計數器</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: rgba(37, 99, 235, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef4ff, var(--bg));
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      color: var(--text);
    }

    .card {
      width: min(90vw, 420px);
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 18px 45px var(--shadow);
      padding: 32px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.9rem;
    }

    .count {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 700;
      color: var(--primary);
      margin: 18px 0 24px;
      letter-spacing: 0.08em;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
    }

    button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    .warning {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #b45309;
      background: #fff7ed;
      padding: 8px 10px;
      border-radius: 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>網站瀏覽計數器</h1>
    <div class="count" id="count">0</div>
    <button id="countBtn" type="button">點擊計數 +1</button>
    <div class="status" id="status">載入中...</div>
    <div class="warning">
      請先把下方的 GAS Web App URL 替換成你部署後的網址。
    </div>
  </div>

  <script>
    const COUNT_ENDPOINT = 'https://script.google.com/macros/s/你的部署ID/exec';
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('status');
    const countBtn = document.getElementById('countBtn');

    async function requestCount(action = 'get') {
      const url = `${COUNT_ENDPOINT}?action=${action}`;
      const response = await fetch(url, { method: 'GET' });

      if (!response.ok) {
        throw new Error('無法取得計數資料');
      }

      const data = await response.json();
      return data;
    }

    async function incrementCount() {
      const response = await fetch(COUNT_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ action: 'increment' })
      });

      if (!response.ok) {
        throw new Error('計數失敗');
      }

      const data = await response.json();
      return data;
    }

    async function loadCount() {
      try {
        const data = await requestCount('get');
        countEl.textContent = Number(data.count || 0);
        statusEl.textContent = '資料已更新';
      } catch (error) {
        countEl.textContent = 'ERR';
        statusEl.textContent = '請檢查 GAS Web App URL 是否正確';
        console.error(error);
      }
    }

    countBtn.addEventListener('click', async () => {
      try {
        statusEl.textContent = '計數中...';
        const data = await incrementCount();
        countEl.textContent = Number(data.count || 0);
        statusEl.textContent = '計數成功';
      } catch (error) {
        statusEl.textContent = '計數失敗，請確認後端設定';
        console.error(error);
      }
    });

    loadCount();
  </script>
</body>
</html>
