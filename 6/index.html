<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網站計數器</title>
  <style>
    :root {
      --bg-1: #f6f0e4;
      --bg-2: #e7dcc1;
      --panel: rgba(255, 255, 255, 0.7);
      --panel-strong: rgba(255, 255, 255, 0.88);
      --gold-1: #d4af67;
      --gold-2: #b88a2a;
      --gold-3: #f6e7b1;
      --ink: #3a2d1d;
      --muted: #7d6c53;
      --line: rgba(180, 142, 72, 0.5);
      --shadow: rgba(87, 70, 31, 0.16);
      --success: #7a5c2a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.85), transparent 38%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      font-family: "Microsoft JhengHei", "PingFang TC", serif;
      color: var(--ink);
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(212, 175, 103, 0.35);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      top: -160px;
      left: -90px;
    }

    body::after {
      right: -80px;
      bottom: -180px;
    }

    .card {
      position: relative;
      width: min(90vw, 430px);
      background: linear-gradient(180deg, var(--panel-strong), rgba(255,255,255,0.72));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 40px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.6);
      padding: 32px 28px 26px;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 14px;
      color: var(--gold-2);
      font-size: 1.6rem;
      letter-spacing: 0.2em;
    }

    .ornament::before,
    .ornament::after {
      content: "✦";
      opacity: 0.85;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #4d3a25;
    }

    .count-wrap {
      position: relative;
      padding: 18px 20px 16px;
      margin: 10px 0 18px;
      background: linear-gradient(180deg, rgba(250,247,239,0.9), rgba(255,255,255,0.7));
      border: 1px solid rgba(180, 142, 72, 0.45);
      border-radius: 16px;
      box-shadow: inset 0 0 18px rgba(212, 175, 103, 0.1);
    }

    .count-label {
      display: block;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .count {
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      font-weight: 700;
      color: #8d6a2f;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 0 rgba(255,255,255,0.8), 0 6px 18px rgba(179, 140, 75, 0.18);
    }

    button {
      width: 100%;
      border: 1px solid rgba(184,138,42,0.8);
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      color: #fffaf0;
      background: linear-gradient(135deg, #d4af67, #b88a2a 52%, #8d6a2f);
      box-shadow: 0 10px 18px rgba(184,138,42,0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(184,138,42,0.32);
      filter: brightness(1.04);
    }

    button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.5em;
      letter-spacing: 0.04em;
    }

    .warning {
      margin-top: 14px;
      font-size: 0.76rem;
      color: #75572d;
      background: rgba(246, 231, 177, 0.4);
      border: 1px solid rgba(180, 142, 72, 0.4);
      padding: 10px 12px;
      border-radius: 10px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ornament" aria-hidden="true">❦</div>
    <h1>網站瀏覽計數器</h1>

    <div class="count-wrap">
      <span class="count-label">Total Visits</span>
      <div class="count" id="count">0</div>
    </div>

    <button id="countBtn" type="button">點擊計數 +1</button>
    <div class="status" id="status">載入中...</div>
    <div class="warning">
      請先把下方的 GAS Web App URL 替換成你部署後的網址。
    </div>
  </div>

  <script>
    const COUNT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxQEYMRVzCDmOL7pERDFc4Ymu9CzmrpcFP7AUVeKcwD1ln1R_oWEa4-IZXXlYvM8giB/exec';
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('status');
    const countBtn = document.getElementById('countBtn');

    async function requestCount(action = 'get') {
      const url = `${COUNT_ENDPOINT}?action=${encodeURIComponent(action)}`;
      const response = await fetch(url, { method: 'GET' });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      return data;
    }

    async function incrementCount() {
      const response = await fetch(COUNT_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ action: 'increment' })
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      return data;
    }

    async function loadCount() {
      try {
        const data = await requestCount('get');
        countEl.textContent = Number(data.count || 0);
        statusEl.textContent = '資料已更新';
      } catch (error) {
        countEl.textContent = 'ERR';
        statusEl.textContent = '請檢查 GAS Web App URL 是否正確';
        console.error('loadCount error:', error);
      }
    }

    countBtn.addEventListener('click', async () => {
      try {
        statusEl.textContent = '計數中...';
        const data = await incrementCount();
        countEl.textContent = Number(data.count || 0);
        statusEl.textContent = '計數成功';
      } catch (error) {
        statusEl.textContent = '計數失敗，請確認後端設定';
        console.error('incrementCount error:', error);
      }
    });

    loadCount();
  </script>
</body>
</html>
