<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網站計數器</title>
  <style>
    :root {
      --bg-1: #f6f0e4;
      --bg-2: #e7dcc1;
      --panel: rgba(255, 255, 255, 0.7);
      --panel-strong: rgba(255, 255, 255, 0.88);
      --gold-1: #d4af67;
      --gold-2: #b88a2a;
      --gold-3: #f6e7b1;
      --ink: #3a2d1d;
      --muted: #7d6c53;
      --line: rgba(180, 142, 72, 0.5);
      --shadow: rgba(87, 70, 31, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.85), transparent 38%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      font-family: "Microsoft JhengHei", "PingFang TC", serif;
      color: var(--ink);
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(212, 175, 103, 0.35);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      top: -160px;
      left: -90px;
    }

    body::after {
      right: -80px;
      bottom: -180px;
    }

    .card {
      position: relative;
      width: min(90vw, 430px);
      background: linear-gradient(180deg, var(--panel-strong), rgba(255,255,255,0.72));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 40px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.6);
      padding: 32px 28px 26px;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 14px;
      color: var(--gold-2);
      font-size: 1.6rem;
      letter-spacing: 0.2em;
    }

    .ornament::before,
    .ornament::after {
      content: "✦";
      opacity: 0.85;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #4d3a25;
    }

    .count-wrap {
      position: relative;
      padding: 18px 20px 16px;
      margin: 10px 0 18px;
      background: linear-gradient(180deg, rgba(250,247,239,0.9), rgba(255,255,255,0.7));
      border: 1px solid rgba(180, 142, 72, 0.45);
      border-radius: 16px;
      box-shadow: inset 0 0 18px rgba(212, 175, 103, 0.1);
    }

    .count-label {
      display: block;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .count {
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      font-weight: 700;
      color: #8d6a2f;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 0 rgba(255,255,255,0.8), 0 6px 18px rgba(179, 140, 75, 0.18);
    }

    .status {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.5em;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ornament" aria-hidden="true">❦</div>
    <h1>網站瀏覽計數器</h1>

    <div class="count-wrap">
      <span class="count-label">Total Visits</span>
      <div class="count" id="count">0</div>
    </div>

    <div class="status" id="status">載入中...</div>
  </div>

  <script>
    const COUNT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwKMqgKLMbppZjcA2fph-fE8ooycD7iJRLytI7td4GZc5BJ9_GdLOKfkOKwLWmQUxE/exec';
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('status');

    function showMessage(message) {
      statusEl.textContent = message;
    }

    async function incrementCount() {
      const nonce = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const url = `${COUNT_ENDPOINT}?action=increment&nonce=${encodeURIComponent(nonce)}`;
      const response = await fetch(url, {
        method: 'GET',
        cache: 'no-store'
      });

      const text = await response.text();

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${text}`);
      }

      try {
        return JSON.parse(text);
      } catch (err) {
        throw new Error(`JSON parse error: ${text}`);
      }
    }

    async function recordVisit() {
      try {
        const data = await incrementCount();
        countEl.textContent = Number(data.count || 0);
        showMessage('瀏覽次數已更新');
      } catch (error) {
        countEl.textContent = 'ERR';
        showMessage('後端設定錯誤：' + error.message);
        console.error('recordVisit error:', error);
      }
    }

    // 每次載入或重新整理頁面時瀏覽數 +1
    recordVisit();
  </script>
</body>
</html>
