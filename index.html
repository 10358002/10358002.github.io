<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集首頁</title>
  <style>
    :root {
      --bg: #f5f1eb;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: #ffffff;
      --text: #1d1d1f;
      --muted: #5d5d63;
      --line: #e7ddd4;
      --orange: #f4935d;
      --orange-deep: #dc6d3b;
      --blue: #5aa6d6;
      --green: #64b38d;
      --purple: #8c6bd8;
      --shadow: 0 18px 40px rgba(31, 31, 31, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(244, 147, 93, 0.18), transparent 20%),
        radial-gradient(circle at bottom right, rgba(90, 166, 214, 0.16), transparent 24%),
        var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 34px;
      padding: 18px 22px;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      backdrop-filter: blur(6px);
    }

    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .title {
      margin: 6px 0 0;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1.1;
      letter-spacing: 0.05em;
    }

    .tagline {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(244, 147, 93, 0.12);
      color: var(--orange-deep);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 26px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 45px rgba(31, 31, 31, 0.12);
    }

    .thumb {
      position: relative;
      height: 220px;
      background: linear-gradient(135deg, #f7f2ee, #eee7e3);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .thumb::before {
      content: "";
      position: absolute;
      inset: 12px 12px auto auto;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      filter: blur(6px);
    }

    .mini-scene {
      position: absolute;
      inset: 0;
    }

    .card-inner {
      padding: 18px 18px 20px;
    }

    .meta {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fef3ee;
      color: var(--orange-deep);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .meta::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      line-height: 1.3;
      letter-spacing: 0.02em;
    }

    .card p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.96rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tags span {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f4f5f7;
      color: #4f5967;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .art-1 {
      background: linear-gradient(180deg, #dff3ff 0%, #bdddfa 45%, #cff0d7 46%, #9fd39a 100%);
    }

    .art-1 .board {
      position: absolute;
      left: 25px;
      right: 25px;
      bottom: 18px;
      height: 110px;
      background: linear-gradient(180deg, #6b421f, #4d2d12);
      border: 8px solid #442b18;
      border-radius: 20px;
      box-shadow: inset 0 12px 20px rgba(255,255,255,0.08);
    }

    .art-1 .board::before,
    .art-1 .board::after {
      content: "";
      position: absolute;
      width: 62px;
      height: 62px;
      bottom: 12px;
      background: linear-gradient(180deg, #a66f42, #7a492d);
      border-radius: 50%;
      box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.12);
    }

    .art-1 .board::before { left: 26px; }
    .art-1 .board::after { right: 26px; }

    .art-1 .mole {
      position: absolute;
      width: 70px;
      height: 82px;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #8c5b3a, #6d412d);
      border-radius: 42% 42% 46% 46%;
      box-shadow: inset 0 -10px 6px rgba(0,0,0,0.12);
    }

    .art-1 .mole::before,
    .art-1 .mole::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      top: 22px;
      background: #1f1d1b;
      border-radius: 50%;
    }

    .art-1 .mole::before { left: 18px; }
    .art-1 .mole::after { right: 18px; }

    .art-1 .mole span {
      position: absolute;
      left: 50%;
      top: 38px;
      width: 28px;
      height: 16px;
      transform: translateX(-50%);
      border-radius: 40%;
      background: #f0d4b2;
    }

    .art-2 {
      background: linear-gradient(180deg, #f8e8dd, #efd6c4 35%, #d7dfef 36%, #b8caeb 100%);
    }

    .art-2 .calc {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 170px;
      background: linear-gradient(180deg, #f5efe8, #d8b79a);
      border: 6px solid #c28663;
      border-radius: 22px;
      box-shadow: 0 16px 25px rgba(123, 75, 48, 0.15);
    }

    .art-2 .screen {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 20px;
      height: 52px;
      background: #dff7f5;
      border-radius: 10px;
      border: 2px solid #8fbebd;
    }

    .art-2 .keys {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .art-2 .keys span {
      display: block;
      height: 24px;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff7f0, #e7d0bb);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .art-3 {
      background: linear-gradient(180deg, #1d2231 0%, #232f44 35%, #4c2d3f 36%, #f1d7d7 100%);
    }

    .art-3 .arena {
      position: absolute;
      inset: 18px 18px 18px 18px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.15);
    }

    .art-3 .fighter {
      position: absolute;
      bottom: 24px;
      width: 66px;
      height: 92px;
      left: 56px;
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      border-radius: 18px 18px 10px 10px;
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(239,68,68,0.25);
    }

    .art-3 .fighter::before,
    .art-3 .fighter::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      top: 24px;
      background: #ffffff;
      border-radius: 50%;
    }

    .art-3 .fighter::before { left: 12px; }
    .art-3 .fighter::after { right: 12px; }

    .art-3 .fighter.rival {
      left: auto;
      right: 56px;
      background: linear-gradient(180deg, #60a5fa, #2563eb);
      transform: scaleX(-1) scale(1.08);
      box-shadow: 0 8px 20px rgba(59,130,246,0.25);
    }

    .art-3 .arena::before,
    .art-3 .arena::after {
      content: "";
      position: absolute;
      bottom: 22px;
      width: 120px;
      height: 14px;
      background: rgba(15, 23, 42, 0.38);
      border-radius: 999px;
    }

    .art-3 .arena::before { left: 40px; }
    .art-3 .arena::after { right: 40px; }

    .art-4 {
      background: linear-gradient(180deg, #fef6d1 0%, #ffd48a 26%, #d6e7d2 27%, #7ca78c 100%);
    }

    .art-4 .runner {
      position: absolute;
      left: 42px;
      bottom: 20px;
      width: 230px;
      height: 120px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(82,102,74,0.2);
    }

    .art-4 .runner::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18px;
      background: linear-gradient(180deg, #5d7f54, #466342);
      border-radius: 14px 14px 0 0;
    }

    .art-4 .runner::after {
      content: "";
      position: absolute;
      left: 24px;
      bottom: 32px;
      width: 18px;
      height: 18px;
      background: #d55d41;
      border-radius: 50%;
      box-shadow: 52px 0 0 #d55d41, 104px 0 0 #d55d41, 156px 0 0 #d55d41;
    }

    .art-4 .stick {
      position: absolute;
      left: 52px;
      bottom: 28px;
      width: 18px;
      height: 54px;
      background: #2d3f2d;
      border-radius: 999px;
      box-shadow: 16px 0 0 0 rgba(45,63,45,0.9), 8px -14px 0 0 rgba(45,63,45,0.9);
    }

    .art-4 .stick::before {
      content: "";
      position: absolute;
      left: 11px;
      top: -7px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f7d8aa;
      box-shadow: inset 0 0 0 4px #2d3f2d;
    }

    @media (max-width: 760px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .portfolio-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <div class="brand">portfolio</div>
        <h1 class="title">我的作品集</h1>
      </div>
      <div class="tagline">creative works</div>
    </header>

    <main class="portfolio-grid">
      <a class="card" href="./1/index.html">
        <div class="thumb art-1">
          <div class="mini-scene">
            <div class="board"></div>
            <div class="mole"><span></span></div>
          </div>
        </div>
        <div class="card-inner">
          <div class="meta">作品 1</div>
          <h2>打地鼠遊戲</h2>
          <p>以快速點擊與計分為核心，玩家在時間限制內打擊出現的地鼠，挑戰反應速度與手眼協調。</p>
          <div class="tags">
            <span>遊戲</span>
            <span>反應</span>
            <span>HTML/CSS</span>
          </div>
        </div>
      </a>

      <a class="card" href="./2/index.html">
        <div class="thumb art-2">
          <div class="mini-scene">
            <div class="calc">
              <div class="screen"></div>
              <div class="keys">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
            </div>
          </div>
        </div>
        <div class="card-inner">
          <div class="meta">作品 2</div>
          <h2>工程計算機</h2>
          <p>設計為簡易工程運算工具，支援數學與三角函數操作，適合快速進行日常計算與題目驗算。</p>
          <div class="tags">
            <span>工具</span>
            <span>計算</span>
            <span>工程</span>
          </div>
        </div>
      </a>

      <a class="card" href="./3/index.html">
        <div class="thumb art-3">
          <div class="mini-scene arena">
            <div class="fighter"></div>
            <div class="fighter rival"></div>
          </div>
        </div>
        <div class="card-inner">
          <div class="meta">作品 3</div>
          <h2>紅色火柴人打架</h2>
          <p>這是一款簡單的格鬥型小遊戲，玩家以移動、跳躍與攻擊方式，與敵人進行對戰與血量競技。</p>
          <div class="tags">
            <span>格鬥</span>
            <span>對戰</span>
            <span>Canvas</span>
          </div>
        </div>
      </a>

      <a class="card" href="./4/index.html">
        <div class="thumb art-4">
          <div class="mini-scene">
            <div class="runner">
              <div class="stick"></div>
            </div>
          </div>
        </div>
        <div class="card-inner">
          <div class="meta">作品 4</div>
          <h2>火柴人閃避者</h2>
          <p>玩家控制角色左右移動、跳躍躲避障礙，藉由持續閃避來提升分數並延長遊戲時間。</p>
          <div class="tags">
            <span>閃避</span>
            <span>跑酷</span>
            <span>分數</span>
          </div>
        </div>
      </a>
    </main>
  </div>
</body>
</html>
