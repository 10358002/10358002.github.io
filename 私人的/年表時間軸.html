<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年表時間軸</title>
<style>
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --ink:#2a2926; --muted:#8b867b; --line:#d5cdbb; --accent:#8a6a3b;
  --shadow:0 1px 2px rgba(60,50,30,.06),0 10px 28px rgba(60,50,30,.07);
  --yw:96px; --lw:44px;
  --font:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",Georgia,serif;
}
[data-theme="dark"]{
  --bg:#121417; --panel:#1a1d22; --ink:#e9e5db; --muted:#8e8b83; --line:#363a41; --accent:#cfae6f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:36px 0 14px}
.title{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:600;letter-spacing:.08em;background:transparent;border:0;border-bottom:1px solid transparent;padding:2px 0;min-width:0;flex:1 1 260px;outline:none}
.title:hover,.title:focus{border-bottom-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:.05em}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover{opacity:.88;color:var(--bg)}
.btn.small{padding:4px 13px;font-size:.88rem}
.btn.danger:hover{border-color:#b5523b;color:#b5523b}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.grow{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem;color:var(--muted)}
.switch input{appearance:none;width:34px;height:19px;border-radius:99px;border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked{border-color:var(--accent)}
.switch input:checked::after{left:17px;background:var(--accent)}
.switch input:checked + span{color:var(--accent)}

/* timeline */
.tl{position:relative;padding:44px 0 90px}
.tl::before{content:"";position:absolute;left:calc(var(--yw) + var(--lw)/2);top:20px;bottom:50px;width:1px;background:var(--line)}
.ev{display:grid;grid-template-columns:var(--yw) var(--lw) 1fr;align-items:start;margin-bottom:28px}
.ev.minor{margin-bottom:20px}
.yr{text-align:right;padding-right:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.major .yr{font-size:1.45rem;color:var(--accent);font-weight:500;padding-top:8px}
.minor .yr{font-size:.95rem;color:var(--muted);padding-top:3px}
.dotw{display:flex;justify-content:center}
.major .dotw{padding-top:17px}
.minor .dotw{padding-top:12px}
.dot{border-radius:50%}
.major .dot{width:13px;height:13px;background:var(--accent);box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--accent)}
.minor .dot{width:8px;height:8px;background:var(--bg);border:1.5px solid var(--muted);margin-top:1px}
.card{position:relative;min-width:0}
.major .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 22px 18px;box-shadow:var(--shadow);transition:border-color .2s}
.major .card:hover{border-color:var(--accent)}
.minor .card{padding:0 0 0 2px}
.card h3{margin:0;font-weight:600;word-break:break-word}
.major h3{font-size:1.28rem}
.minor h3{font-size:1.02rem;font-weight:500}
.card p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.major p{font-size:.98rem}
.minor p{font-size:.88rem;margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 11px 1px 9px;font-size:.84rem;background:transparent}
.minor .chip{font-size:.78rem;padding:0 9px 0 7px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip b{font-weight:400;color:var(--muted)}
.region-tag,.year-sub,.year-mini{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px;font-size:.72rem;color:var(--muted);background:rgba(138,106,59,.04)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.year-sub,.year-mini{margin-left:0}
.major .year-mini{display:none}
.minor .year-sub{display:none}

/* dialogs */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:0;width:min(520px,calc(100vw - 28px));box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh}
dialog::backdrop{background:rgba(10,10,10,.45);backdrop-filter:blur(2px)}
.dbody{padding:26px 26px 22px;overflow:auto;max-height:88vh}
.dbody h2{margin:0 0 18px;font-size:1.2rem;letter-spacing:.1em;font-weight:600}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px;letter-spacing:.05em}
.in{width:100%;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 11px;outline:none;transition:border-color .2s}
.in:focus{border-color:var(--accent)}
textarea.in{resize:vertical;min-height:84px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:14px}
.seg label{flex:1;text-align:center;cursor:pointer}
.seg input{display:none}
.seg span{display:block;padding:6px 0;font-size:.92rem;color:var(--muted);transition:.2s}
.seg input:checked + span{background:var(--accent);color:var(--bg)}
.picks{display:flex;flex-wrap:wrap;gap:7px}
.pick{cursor:pointer}
.pick input{display:none}
.pick span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 13px 2px 10px;font-size:.9rem;color:var(--muted);transition:.2s}
.pick span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pick input:checked + span{border-color:var(--c);color:var(--ink);box-shadow:inset 0 0 0 1px var(--c)}
.hint{font-size:.82rem;color:var(--muted);margin:2px 0 0}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.clist{margin:0 0 16px;padding:0;list-style:none;border-top:1px solid var(--line)}
.clist li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.clist .sw{width:11px;height:11px;border-radius:50%;flex:none}
.clist .nm{flex:1;min-width:0}
.clist small{color:var(--muted)}
.cform{border:1px dashed var(--line);border-radius:12px;padding:16px 16px 6px}
.cform .three{display:grid;grid-template-columns:1fr 1fr 54px;gap:10px}
input[type=color].in{padding:2px;height:38px;cursor:pointer}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  :root{--yw:62px;--lw:30px}
  .major .yr{font-size:1.1rem}
  .major .card{padding:14px 16px 16px}
  .two{grid-template-columns:1fr}
}

/* button styles */
.acts{position:absolute;top:8px;right:10px;display:flex;gap:2px;opacity:0;transition:opacity .2s}
.minor .acts{top:-4px}
.ev:hover .acts,.acts:focus{opacity:1}
@media (hover:none){.acts{opacity:.7}}
.ibtn{border:1px solid var(--line);background:rgba(255,255,255,.22);color:var(--ink);cursor:pointer;padding:4px 10px;border-radius:999px;font-size:.78rem;line-height:1.2;transition:all .2s;white-space:nowrap}
.ibtn:hover{border-color:var(--accent);color:var(--accent);background:rgba(138,106,59,.04)}
.ibtn.del{border-color:rgba(181,82,59,.35);color:#b5523b;background:rgba(181,82,59,.06)}
.ibtn.del:hover{border-color:#b5523b;color:#b5523b;background:rgba(181,82,59,.1)}
.clist .ibtn{padding:3px 8px;min-width:38px}
.clist .ibtn.del{min-width:46px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <input id="titleInput" class="title" maxlength="40" aria-label="時間軸標題" placeholder="記事年表">
    <div class="row">
      <button class="btn" id="themeBtn"></button>
      <button class="btn" id="charBtn">人物</button>
      <button class="btn" id="regionBtn">地區</button>
      <button class="btn primary" id="addBtn">＋ 新增事件</button>
    </div>
  </header>

  <div class="tools">
    <label class="switch"><input type="checkbox" id="onlyMajor"><span>只看大事件</span></label>
    <span class="grow"></span>
    <button class="btn small" id="pngBtn">下載圖片</button>
    <button class="btn small" id="saveBtn">儲存</button>
    <button class="btn small" id="exportBtn">匯出備份</button>
    <label class="btn small" style="cursor:pointer">匯入備份<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    <button class="btn small danger" id="clearBtn">清空</button>
  </div>

  <main><div class="tl" id="tl"></div></main>
</div>

<!-- 事件 -->
<dialog id="evDlg">
  <form class="dbody" id="evForm">
    <h2 id="evHead">新增事件</h2>
    <div class="seg">
      <label><input type="radio" name="etype" value="major" checked><span>大事件</span></label>
      <label><input type="radio" name="etype" value="minor"><span>小事件</span></label>
    </div>
    <label class="f"><span>年份（西元前請填負數，如 -221）</span><input class="in" id="evYear" type="number" step="1" required></label>
    <label class="f"><span>標題</span><input class="in" id="evTitle" maxlength="60" required></label>
    <label class="f"><span>地區</span><select class="in" id="evRegion"></select></label>
    <label class="f"><span>說明（選填）</span><textarea class="in" id="evDesc" maxlength="600"></textarea></label>
    <div class="f"><span>相關人物（可複選，年齡依年份自動計算）</span><div class="picks" id="evChars"></div></div>
    <div class="foot">
      <button type="button" class="btn" id="evCancel">取消</button>
      <button type="submit" class="btn primary">確定</button>
    </div>
  </form>
</dialog>

<!-- 人物 -->
<dialog id="chDlg">
  <div class="dbody">
    <h2>人物管理</h2>
    <ul class="clist" id="clist"></ul>
    <form class="cform" id="chForm">
      <label class="f"><span id="chFormHead">新增人物</span><input class="in" id="chName" maxlength="20" placeholder="姓名" required></label>
      <div class="two">
        <label class="f"><span>地區</span><select class="in" id="chRegion"></select></label>
      </div>
      <div class="three">
        <label class="f"><span>出生年</span><input class="in" id="chBirth" type="number" step="1" required></label>
        <label class="f"><span>逝世年（選填）</span><input class="in" id="chDeath" type="number" step="1"></label>
        <label class="f"><span>顏色</span><input class="in" id="chColor" type="color"></label>
      </div>
      <div class="foot" style="margin:0 0 12px">
        <button type="button" class="btn small" id="chReset">清除</button>
        <button type="submit" class="btn small primary" id="chSubmit">加入</button>
      </div>
    </form>

    <div class="cform" style="margin-top:16px">
      <div>
        <label class="f"><span>新增地區</span><input class="in" id="regionInput" placeholder="例如：中國"></label>
        <div class="foot" style="margin:0 0 4px"><button type="button" class="btn small primary" id="addRegionBtn">新增地區</button></div>
        <ul class="clist" id="regionList"></ul>
      </div>
    </div>

    <div class="foot"><button class="btn" id="chDone" type="button">完成</button></div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
const KEY = 'elegant-timeline-v1';
const COLORS = ['#b5523b','#3f6e8c','#5f8a5b','#8a6a9e','#c28b2c','#5a6470'];
const FONT = '"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",Georgia,serif';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => e.append(c ?? ''));
  return e;
}

function ensureList(values, fallback) {
  const source = Array.isArray(values) ? values : (fallback || []);
  const out = [];
  const seen = new Set();
  source.forEach(v => {
    const s = String(v || '').trim();
    if (s && !seen.has(s)) { seen.add(s); out.push(s); }
  });
  return out;
}

function normalizeStateData(d) {
  const base = d || {};
  const chars = Array.isArray(base.characters) ? base.characters : [];
  const events = Array.isArray(base.events) ? base.events : [];
  const regions = ensureList(base.regions, ['中國', '日本', '歐洲', '美洲', '中東', '東南亞']);
  const families = [];

  chars.forEach(c => {
    if (!c.region && regions.length) c.region = regions[0];
    if (c.family != null) delete c.family;
    if (c.order == null) c.order = 0;
  });
  events.forEach(e => {
    if (!e.region && regions.length) e.region = regions[0];
  });

  return {
    title: String(base.title || '記事年表'),
    theme: base.theme || null,
    regions,
    families,
    characters: chars,
    events: events
  };
}

function sample() {
  const a = uid();
  const b = uid();
  return {
    title: '記事年表',
    theme: null,
    regions: ['中國', '日本', '歐洲', '美洲', '中東', '東南亞'],
    families: [],
    characters: [
      { id: a, name: '瑪麗·居禮', birth: 1867, death: 1934, color: COLORS[0], region: '歐洲', order: 0 },
      { id: b, name: '愛因斯坦', birth: 1879, death: 1955, color: COLORS[1], region: '歐洲', order: 1 }
    ],
    events: [
      { id: uid(), year: 1898, type: 'minor', title: '發現釙與鐳', desc: '與皮耶·居禮共同發現兩種新元素。', chars: [a], region: '歐洲' },
      { id: uid(), year: 1903, type: 'major', title: '獲頒諾貝爾物理學獎', desc: '因放射性研究與貝克勒、皮耶·居禮共同獲獎。', chars: [a], region: '歐洲' },
      { id: uid(), year: 1905, type: 'major', title: '奇蹟年', desc: '發表光電效應、布朗運動與狹義相對論等論文。', chars: [b], region: '歐洲' },
      { id: uid(), year: 1911, type: 'minor', title: '獲頒諾貝爾化學獎', desc: '成為首位兩度獲得諾貝爾獎的人。', chars: [a], region: '歐洲' },
      { id: uid(), year: 1915, type: 'major', title: '提出廣義相對論', desc: '重力被描述為時空的彎曲。', chars: [b], region: '歐洲' },
      { id: uid(), year: 1921, type: 'minor', title: '獲頒諾貝爾物理學獎', desc: '表彰其對光電效應定律的發現。', chars: [b], region: '歐洲' },
      { id: uid(), year: 1927, type: 'major', title: '第五屆索爾維會議', desc: '物理學界群英齊聚布魯塞爾，討論量子理論。', chars: [a, b], region: '歐洲' }
    ]
  };
}

const valid = d => d && Array.isArray(d.events) && Array.isArray(d.characters);

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const d = JSON.parse(s);
      if (valid(d)) return normalizeStateData(d);
    }
  } catch (e) {}
  return sample();
}

let state = load();

function save(msg) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    if (msg) toast('已儲存於此瀏覽器');
  } catch (e) {
    toast('無法寫入瀏覽器儲存，請改用「匯出備份」');
  }
}

let toastT;
function toast(t) {
  const n = $('#toast');
  n.textContent = t;
  n.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => n.classList.remove('show'), 2200);
}

const fmtYear = y => y < 0 ? `前 ${-y}` : String(y);
function ageText(c, y) {
  if (y < c.birth) return '尚未出生';
  if (c.death != null && y > c.death) return '已逝世';
  const a = y - c.birth;
  return a === 0 ? '出生' : a + ' 歲';
}
const charById = id => state.characters.find(c => c.id === id);
const sortedEvents = () => [...state.events].sort((a, b) => a.year - b.year);
const sortedCharacters = () => [...state.characters].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

function moveCharacter(id, step) {
  const items = sortedCharacters();
  const index = items.findIndex(c => c.id === id);
  if (index < 0) return;
  const next = index + step;
  if (next < 0 || next >= items.length) return;
  const [a] = items.splice(index, 1);
  items.splice(next, 0, a);
  state.characters = items.map((c, idx) => ({ ...c, order: idx }));
  renderChars();
  render();
  save();
}

function uniqueList(items) {
  return [...new Set(items.filter(Boolean))];
}

function fillSelect(select, items, currentValue = '') {
  const values = items && items.length ? items : [''];
  select.replaceChildren();
  const add = (v, label) => {
    const option = el('option', { value: v }, label);
    if (currentValue === v) option.selected = true;
    select.append(option);
  };
  add('', '未指定');
  values.forEach(v => add(v, v));
  if (!currentValue) select.value = '';
}

function renderMetadataSelectors() {
  const evRegion = $('#evRegion');
  fillSelect(evRegion, state.regions, evRegion.value || '');
  const chRegion = $('#chRegion');
  fillSelect(chRegion, state.regions, chRegion.value || '');
}

function renderRegions() {
  const list = $('#regionList');
  list.replaceChildren();
  if (!state.regions.length) {
    list.append(el('li', {}, el('small', {}, '尚無地區')));
    return;
  }
  state.regions.forEach(region => {
    list.append(el('li', {},
      el('span', { class: 'nm' }, region),
      el('button', { class: 'ibtn del', type: 'button', onclick: () => {
        if (!confirm(`刪除地區「${region}」？相關人物/事件中的此地區會保留為未指定。`)) return;
        state.regions = state.regions.filter(r => r !== region);
        state.characters.forEach(c => { if (c.region === region) c.region = ''; });
        state.events.forEach(e => { if (e.region === region) e.region = ''; });
        renderMetadataSelectors();
        renderRegions();
        renderChars();
        render();
        save();
      } }, '刪除')));
  });
}

$('#regionBtn').onclick = () => {
  $('#chDlg').showModal();
  setTimeout(() => $('#regionInput').focus(), 100);
};
$('#addRegionBtn').onclick = () => {
  const v = $('#regionInput').value.trim();
  if (!v) { toast('請輸入地區名稱'); return; }
  if (!state.regions.includes(v)) state.regions.push(v);
  $('#regionInput').value = '';
  renderMetadataSelectors();
  renderRegions();
  save();
};

function currentTheme() {
  return state.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}

function applyTheme() {
  const t = currentTheme();
  document.documentElement.dataset.theme = t;
  $('#themeBtn').textContent = t === 'dark' ? '☀ 日間' : '☾ 夜間';
}
$('#themeBtn').onclick = () => { state.theme = currentTheme() === 'dark' ? 'light' : 'dark'; applyTheme(); save(); };

function render() {
  $('#titleInput').value = state.title || '';
  document.title = state.title || '記事年表';
  const tl = $('#tl');
  tl.replaceChildren();
  const only = $('#onlyMajor').checked;
  const list = sortedEvents().filter(e => !only || e.type === 'major');

  if (!list.length) {
    tl.append(el('div', { class: 'empty' }, '尚無事件，點選右上角「＋ 新增事件」開始建立。'));
    tl.style.setProperty('--x', '0');
    return;
  }

  list.forEach(e => {
    const yearRegions = uniqueList(list.filter(item => item.year === e.year).map(item => item.region));
    const sameYearBadge = yearRegions.length > 1 ? el('span', { class: 'year-sub' }, '同年跨區') : '';
    const regionBadge = e.region ? el('span', { class: 'region-tag' }, e.region) : '';
    const chips = el('div', { class: 'chips' });
    e.chars.map(charById).filter(Boolean).forEach(c =>
      chips.append(el('span', { class: 'chip', style: `--c:${c.color}` }, el('i'), c.name, el('b', {}, '· ' + ageText(c, e.year))))
    );

    const card = el('div', { class: 'card' },
      el('div', { class: 'acts' },
        el('button', { class: 'ibtn', title: '編輯', onclick: () => openEvent(e.id) }, '編輯'),
        el('button', { class: 'ibtn del', title: '刪除', onclick: () => delEvent(e.id) }, '刪除')),
      el('h3', {}, e.title),
      el('div', { class: 'meta' }, regionBadge, sameYearBadge),
      e.desc ? el('p', {}, e.desc) : '',
      e.chars.length ? chips : '');

    tl.append(el('article', { class: 'ev ' + e.type },
      el('div', { class: 'yr' }, fmtYear(e.year)),
      el('div', { class: 'dotw' }, el('div', { class: 'dot' })),
      card));
  });
}
$('#onlyMajor').onchange = render;
$('#titleInput').oninput = e => {
  state.title = e.target.value;
  document.title = state.title || '記事年表';
  save();
};

const evDlg = $('#evDlg');
let editingId = null;
function openEvent(id) {
  editingId = id || null;
  const e = id ? state.events.find(x => x.id === id) : null;
  $('#evHead').textContent = e ? '編輯事件' : '新增事件';
  $('#evYear').value = e ? e.year : '';
  $('#evTitle').value = e ? e.title : '';
  $('#evDesc').value = e ? e.desc : '';
  $('#evRegion').value = e && e.region ? e.region : '';
  document.querySelector(`input[name=etype][value=${e ? e.type : 'major'}]`).checked = true;

  const box = $('#evChars');
  box.replaceChildren();
  if (!state.characters.length) box.append(el('p', { class: 'hint' }, '尚未建立人物，可先到「人物」新增。'));
  state.characters.forEach(c => {
    const cb = el('input', { type: 'checkbox', value: c.id });
    cb.checked = e ? e.chars.includes(c.id) : false;
    box.append(el('label', { class: 'pick', style: `--c:${c.color}` }, cb, el('span', {}, c.name)));
  });

  renderMetadataSelectors();
  evDlg.showModal();
}
$('#addBtn').onclick = () => openEvent();
$('#evCancel').onclick = () => evDlg.close();
$('#evForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const year = parseInt($('#evYear').value, 10);
  const title = $('#evTitle').value.trim();
  if (isNaN(year) || !title) { toast('請填寫年份與標題'); return; }

  const data = {
    year,
    title,
    desc: $('#evDesc').value.trim(),
    type: document.querySelector('input[name=etype]:checked').value,
    chars: [...$('#evChars').querySelectorAll('input:checked')].map(i => i.value),
    region: $('#evRegion').value || ''
  };

  if (editingId) Object.assign(state.events.find(x => x.id === editingId), data);
  else state.events.push({ id: uid(), ...data });
  evDlg.close();
  render();
  save();
});

function delEvent(id) {
  if (!confirm('確定刪除此事件？')) return;
  state.events = state.events.filter(e => e.id !== id);
  render();
  save();
}

const chDlg = $('#chDlg');
let editingChar = null;
function nextColor() { return COLORS[state.characters.length % COLORS.length]; }
function resetCharForm() {
  editingChar = null;
  $('#chName').value = '';
  $('#chBirth').value = '';
  $('#chDeath').value = '';
  $('#chColor').value = nextColor();
  $('#chRegion').value = '';
  $('#chFormHead').textContent = '新增人物';
  $('#chSubmit').textContent = '加入';
}

function renderChars() {
  const ul = $('#clist');
  ul.replaceChildren();
  if (!state.characters.length) ul.append(el('li', {}, el('small', {}, '尚無人物')));

  const items = sortedCharacters();
  items.forEach(c => {
    const info = c.region || '未指定地區';
    ul.append(el('li', {},
      el('span', { class: 'sw', style: `background:${c.color}` }),
      el('span', { class: 'nm' }, c.name, ' ', el('small', {}, `${fmtYear(c.birth)} – ${c.death != null ? fmtYear(c.death) : ''}　${info}`)),
      el('button', { class: 'ibtn', type: 'button', onclick: () => moveCharacter(c.id, -1) }, '↑'),
      el('button', { class: 'ibtn', type: 'button', onclick: () => moveCharacter(c.id, 1) }, '↓'),
      el('button', { class: 'ibtn', type: 'button', onclick: () => {
        editingChar = c.id;
        $('#chName').value = c.name;
        $('#chBirth').value = c.birth;
        $('#chDeath').value = c.death ?? '';
        $('#chColor').value = c.color;
        $('#chRegion').value = c.region || '';
        $('#chFormHead').textContent = '編輯人物';
        $('#chSubmit').textContent = '更新';
      } }, '編輯'),
      el('button', { class: 'ibtn del', type: 'button', onclick: () => {
        if (!confirm(`刪除「${c.name}」？相關事件中的此人物也會一併移除。`)) return;
        state.characters = state.characters.filter(x => x.id !== c.id);
        state.events.forEach(e => e.chars = e.chars.filter(i => i !== c.id));
        if (editingChar === c.id) resetCharForm();
        renderChars();
        render();
        save();
      } }, '刪除')));
  });
}

$('#charBtn').onclick = () => {
  resetCharForm();
  renderMetadataSelectors();
  renderChars();
  chDlg.showModal();
};
$('#chDone').onclick = () => chDlg.close();
$('#chReset').onclick = resetCharForm;
$('#chForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const name = $('#chName').value.trim();
  const birth = parseInt($('#chBirth').value, 10);
  const dv = $('#chDeath').value;
  const death = dv === '' ? null : parseInt(dv, 10);
  if (!name || isNaN(birth)) { toast('請填寫姓名與出生年'); return; }
  if (death != null && (isNaN(death) || death < birth)) { toast('逝世年不可早於出生年'); return; }

  const data = {
    name,
    birth,
    death,
    color: $('#chColor').value,
    region: $('#chRegion').value || ''
  };

  if (editingChar) Object.assign(state.characters.find(c => c.id === editingChar), data);
  else state.characters.push({ id: uid(), order: state.characters.length, ...data });

  resetCharForm();
  renderMetadataSelectors();
  renderChars();
  render();
  save();
});

$('#saveBtn').onclick = () => save(true);
function download(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileName = ext => (state.title || '記事年表').replace(/[\\/:*?"<>|]/g, '_') + '.' + ext;
$('#exportBtn').onclick = () => {
  download(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), fileName('json'));
  toast('已匯出備份檔');
};
$('#importFile').onchange = async ev => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!valid(d)) throw 0;
    if (!confirm('匯入將取代目前的內容，確定嗎？')) return;
    state = normalizeStateData(d);
    applyTheme();
    render();
    renderMetadataSelectors();
    renderRegions();
    renderChars();
    save();
    toast('匯入完成');
  } catch (e) {
    toast('檔案格式不正確');
  }
};
$('#clearBtn').onclick = () => {
  if (!confirm('清空所有事件與人物？此動作無法復原（建議先匯出備份）。')) return;
  state.events = [];
  state.characters = [];
  state.regions = [];
  state.families = [];
  render();
  renderChars();
  renderRegions();
  save();
};

function themeColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  return { bg: g('--bg'), panel: g('--panel'), ink: g('--ink'), muted: g('--muted'), line: g('--line'), accent: g('--accent') };
}

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrap(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(para => {
    let line = '';
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
      else line += ch;
    }
    out.push(line);
  });
  return out;
}

function paint(ctx, W, draw, pos) {
  const T = themeColors();
  const pad = 80, yearR = pad + 150, lineX = pad + 190, cardX = pad + 232, cardW = W - pad - cardX;
  const list = sortedEvents().filter(e => !$('#onlyMajor').checked || e.type === 'major');
  let y = pad;

  let size = 46;
  ctx.font = `600 ${size}px ${FONT}`;
  while (ctx.measureText(state.title || '').width > W - pad * 2 && size > 22) { size -= 2; ctx.font = `600 ${size}px ${FONT}`; }
  if (draw) { ctx.textAlign = 'center'; ctx.fillStyle = T.ink; ctx.fillText(state.title || '記事年表', W / 2, y + 44); }
  y += 84;
  if (draw) {
    ctx.font = `400 20px ${FONT}`; ctx.fillStyle = T.muted;
    ctx.fillText(`共 ${list.length} 件事件　·　大事件 ${list.filter(e => e.type === 'major').length}`, W / 2, y);
    ctx.fillStyle = T.accent; ctx.fillRect(W / 2 - 30, y + 26, 60, 2);
  }
  y += 86;

  if (draw && pos && pos.first != null) {
    ctx.strokeStyle = T.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(lineX, pos.first - 30); ctx.lineTo(lineX, pos.last + 30); ctx.stroke();
  }

  let first = null, last = null;
  list.forEach(e => {
    const major = e.type === 'major';
    const tf = major ? `600 30px ${FONT}` : `500 24px ${FONT}`;
    const df = major ? `400 21px ${FONT}` : `400 19px ${FONT}`;
    const padX = major ? 28 : 0, padY = major ? 24 : 0;
    const innerW = cardW - padX * 2;
    const tlh = major ? 40 : 32, dlh = major ? 33 : 29;

    ctx.font = tf; const tLines = wrap(ctx, e.title, innerW);
    ctx.font = df; const dLines = e.desc ? wrap(ctx, e.desc, innerW) : [];

    const chH = major ? 34 : 30;
    ctx.font = `400 ${major ? 18 : 16}px ${FONT}`;
    const chips = []; let cx = 0, row = 0;
    e.chars.map(charById).filter(Boolean).forEach(c => {
      const text = `${c.name} · ${ageText(c, e.year)}`;
      const w = 14 + 8 + 8 + ctx.measureText(text).width + 14;
      if (cx + w > innerW && cx > 0) { cx = 0; row++; }
      chips.push({ text, w, x: cx, row, color: c.color });
      cx += w + 8;
    });
    const rows = chips.length ? chips[chips.length - 1].row + 1 : 0;
    const h = padY * 2 + tLines.length * tlh + (dLines.length ? 6 + dLines.length * dlh : 0) + (rows ? 14 + rows * (chH + 8) - 8 : 0) + (e.region ? 18 : 0);
    const top = y;
    const dotY = top + padY + (major ? 22 : 17);
    if (first == null) first = dotY; last = dotY;

    if (draw) {
      if (major) {
        ctx.fillStyle = T.panel; ctx.strokeStyle = T.line; ctx.lineWidth = 1.5;
        rr(ctx, cardX, top, cardW, h, 14); ctx.fill(); ctx.stroke();
      }
      ctx.textAlign = 'right'; ctx.fillStyle = major ? T.accent : T.muted;
      ctx.font = major ? `500 34px ${FONT}` : `400 22px ${FONT}`;
      ctx.fillText(fmtYear(e.year), yearR, dotY + (major ? 12 : 8));
      ctx.fillStyle = T.bg; ctx.beginPath(); ctx.arc(lineX, dotY, major ? 12 : 8, 0, 7); ctx.fill();
      if (major) {
        ctx.strokeStyle = T.accent; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(lineX, dotY, 11, 0, 7); ctx.stroke();
        ctx.fillStyle = T.accent; ctx.beginPath(); ctx.arc(lineX, dotY, 6.5, 0, 7); ctx.fill();
      } else {
        ctx.strokeStyle = T.muted; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(lineX, dotY, 5, 0, 7); ctx.stroke();
      }

      ctx.textAlign = 'left';
      let ty = top + padY; const tx = cardX + padX;
      ctx.font = tf; ctx.fillStyle = T.ink;
      tLines.forEach((l, i) => ctx.fillText(l, tx, ty + (major ? 30 : 24) + i * tlh));
      ty += tLines.length * tlh;
      if (e.region) {
        ty += 6; ctx.font = `400 16px ${FONT}`; ctx.fillStyle = T.muted;
        ctx.fillText(`地區：${e.region}`, tx, ty + 18);
        ty += 18;
      }
      if (dLines.length) {
        ty += 6; ctx.font = df; ctx.fillStyle = T.muted;
        dLines.forEach((l, i) => ctx.fillText(l, tx, ty + (major ? 23 : 20) + i * dlh));
        ty += dLines.length * dlh;
      }
      if (rows) {
        ty += 14;
        ctx.font = `400 ${major ? 18 : 16}px ${FONT}`;
        chips.forEach(c => {
          const cy = ty + c.row * (chH + 8);
          ctx.strokeStyle = T.line; ctx.lineWidth = 1.5;
          rr(ctx, tx + c.x, cy, c.w, chH, chH / 2); ctx.stroke();
          ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(tx + c.x + 18, cy + chH / 2, 4.5, 0, 7); ctx.fill();
          ctx.fillStyle = T.ink; ctx.fillText(c.text, tx + c.x + 30, cy + chH / 2 + (major ? 6 : 5.5));
        });
      }
    }
    y = top + h + (major ? 46 : 34);
  });

  if (!list.length && draw) {
    ctx.textAlign = 'center'; ctx.fillStyle = T.muted; ctx.font = `400 22px ${FONT}`;
    ctx.fillText('尚無事件', W / 2, y + 20);
  }
  if (!list.length) y += 60;
  y += 10;
  if (draw) {
    ctx.textAlign = 'center'; ctx.fillStyle = T.muted; ctx.font = `400 15px ${FONT}`;
    const d = new Date();
    ctx.fillText(`${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`, W / 2, y + 10);
  }
  return { H: y + pad, first, last };
}

$('#pngBtn').onclick = () => {
  const W = 1200;
  const probe = document.createElement('canvas').getContext('2d');
  const m = paint(probe, W, false);
  const H = Math.ceil(m.H);
  const scale = Math.min(2, 16000 / H);
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = themeColors().bg;
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';
  paint(ctx, W, true, m);
  cv.toBlob(b => {
    if (!b) { toast('圖片產生失敗'); return; }
    download(b, fileName('png'));
    toast('圖片已產生');
  }, 'image/png');
};

renderMetadataSelectors();
renderRegions();
renderChars();
applyTheme();
render();
})();
</script>
